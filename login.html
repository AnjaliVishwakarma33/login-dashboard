<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>VSPAGY</title>
    <link rel="icon" type="image/png" href="assets/logo.webp" />
    <!-- Bootstrap 5 -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <!-- Custom CSS -->
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="login-wrapper">
      <div class="container h-100">
        <div class="row h-100">
          <!-- LEFT SECTION -->
          <div class="col-lg-7 left-section">
            <div class="content">
              <a href="home.html">
                <img src="assets/logo.webp" alt="Logo" class="logo" />
              </a>
              <h4 class="mt-4">Advisor Referral Program</h4>
              <p>
                A program designed to empower you, your friends and your family.
              </p>
              <div
                class="d-flex align-items-center gap-3 text-secondary small mt-5 flex-wrap"
              >
                <div class="d-flex align-items-center gap-1">
                  <img src="assets/grow-icon.png" alt="Grow" class="tag-icon" />
                  <span class="fw-medium">GROW</span>
                </div>

                <span class="opacity-50">|</span>

                <div class="d-flex align-items-center gap-1">
                  <img
                    src="assets/succeed-icon.png"
                    alt="Succeed"
                    class="tag-icon"
                  />
                  <span class="fw-medium">SUCCEED</span>
                </div>

                <span class="opacity-50">|</span>

                <div class="d-flex align-items-center gap-1">
                  <img
                    src="assets/empower-icon.png"
                    alt="Empower"
                    class="tag-icon"
                  />
                  <span class="fw-medium">EMPOWER</span>
                </div>
              </div>
            </div>
            <img src="assets/img3.png" class="people-img" alt="people" />
          </div>
          <!-- RIGHT SECTION -->
          <div class="col-lg-5 col-12 right-section">
            <div class="login-box mb-5">
              <!-- MOBILE LOGIN -->
              <div id="mobileSection">
                <h4>Login</h4>
                <p>Welcome back mate!</p>

                <label class="form-label mt-3">Your Mobile Number</label>
                <input
                  type="tel"
                  class="form-control mb-3 mobile-input"
                  placeholder="+91 9999999999"
                  id="mobile"
                />

                <button
                  class="btn btn-primary w-100 btn_otp"
                  onclick="showOTP()"
                >
                  Send OTP
                </button>
              </div>

              <!-- OTP SECTION -->
              <div id="otpSection" class="d-none">
                <h4>Login</h4>
                <p>Welcome back mate!</p>
                <p class="mt-3">
                  Enter the OTP sent to
                  <span class="text-primary">+91 9999999999</span>
                  <a href="#" class="text-primary" onclick="editNumber()"
                    >Change Number</a
                  >
                </p>

                <div class="otp-box">
                  <input maxlength="1" />
                  <input maxlength="1" />
                  <input maxlength="1" />
                  <input maxlength="1" />
                </div>

                <p class="resend">
                  OTP not received?
                  <a href="#"
                    ><img src="assets/resend-icon.png" alt="resend" />Resend</a
                  >
                </p>

                <a href="dashboard.html"
                  ><button class="btn btn-primary w-100">
                    Verify & Login
                  </button></a
                >
              </div>
            </div>

            <p class="righttxt">All Right Reserved 2025</p>
          </div>
        </div>
      </div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
